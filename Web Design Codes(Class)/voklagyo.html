<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Layout</title>
    <link rel="stylesheet" href="eat.css">
</head>

<body>


    <header>
        <div class="logo">
            <img src="./assets/image 1.jpg" alt="logo">
        </div>
        <nav>
            <ul>
                <li> <a href="#">Home</a></li>
                <li> <a href="#">About</a></li>
                <li> <a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>


    <section class="featured-post">
        <h1>Featured Post</h1>
    </section>


    <main>


        <section class="recent-posts">
            <h2>Recent Post</h2>

            <div class="post">

                <div class="post-text">
                    <img src="./assets/image 2.jpg" alt="img">
                    <p>Short description of post 1...</p>
                </div>
            </div>

            <div class="post">
                <img src="./assets/image 4.jpg" alt="img">
                <div class="post-text">
                    <h3>Post 2</h3>
                    <p>Short description of post 2...</p>
                </div>
            </div>
        </section>


        <aside>

            <div class="box">
                <h3>Subscribe</h3>
                <form>
                    <input type="email" placeholder="Email">
                    <button type="submit">Join</button>
                </form>
            </div>

            <div class="box">
                <h3>Category</h3>
                <div class="categories">
                    <button>Cat 1</button>
                    <button>Cat 2</button>
                    <button>Cat 3</button>
                    <button>Cat 4</button>
                </div>
            </div>
            
        </aside>

    </main>

</body>

</html>
